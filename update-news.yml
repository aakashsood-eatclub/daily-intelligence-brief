name: Update daily news

on:
  workflow_dispatch:
  schedule:
    # 06:30 IST = 01:00 UTC; allows time before the 07:00 target.
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect headlines
        run: python collect_news.py
      - name: Publish news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily news headlines"
            git push
          fi
